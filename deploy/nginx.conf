server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|jpg|jpeg|webp|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
